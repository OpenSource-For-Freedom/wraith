# ═══════════════════════════════════════════════════════════════════════════════
# WRAITH — Build & Release
#
# Trigger : push to main         →  stable release   (next patch, latest by SemVer)
#           push of v*.*.* tag   →  stable release   (explicit tag, latest by SemVer)
#
# Every push to main publishes a stable release using the next available patch
# in the major.minor line declared by VERSION. The GitHub server picks Latest
# by SemVer compare (`make_latest: legacy`), so the wraithsec-site auto-update
# probe (which calls /releases/latest) always sees the freshest stable within
# minutes of a merge — no manual tag step required.
#
# Tag pushes still work for explicit backports / hotfixes off a non-main branch.
#
# Artifact: WRAITH-<version>-win-x64.zip
#   ├── WRAITH.exe        (self-contained, Windows-branded, .NET runtime + icon
#   │                      + version stamped, single executable — no SDK needed)
#   ├── scanner/          (Python scan engine — required by every Python-backed
#   │                      scan path; BootstrapService.ResolveBaseDir() joins
#   │                      "scanner" to the EXE dir at runtime)
#   ├── automation/       (PowerShell scripts the tray-menu Register-Wraith*
#   │                      tasks invoke; missing → menu actions silently no-op)
#   └── README.md
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [ main ]
    tags:     [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents:          write
  security-events:   write

# Serialize runs per ref so two overlapping main pushes can't both
# compute the same $nextStable and race the tag creation. cancel-in-progress
# is deliberately false — each merge to main is its own release, so the
# second run waits for the first to publish (and bump the tag space) before
# it derives its own version. Tag-push runs are scoped by their unique tag
# ref, so they never collide.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            nuget.org:443
            api.nuget.org:443
            pypi.org:443
            files.pythonhosted.org:443
            discord.com:443
            discordapp.com:443
            timestamp.digicert.com:443
            dl.dod.certificate.gov:443

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0        

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Derive version
        id: ver
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --quiet

          if ($env:REF_TYPE -eq 'tag') {
            # ── Stable release path ───────────────────────────────────────
            # The pushed tag IS the version. Operator made the choice
            # intentionally; if it's a backport the GitHub server will
            # decline to mark it latest via make_latest=legacy.
            $v = $env:REF_NAME
            if ($v -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Tag '$v' does not match vMAJOR.MINOR.PATCH (the trigger filter should have prevented this)."
            }
            $packVer      = $v.TrimStart('v')
            $assemblyVer  = "$packVer.0"
            $prerelease   = 'false'
            $makeLatest   = 'legacy'   # GitHub server picks latest by SemVer
            Write-Host "Stable release: $v"
          }
          else {
            # ── Stable release path (main push) ───────────────────────────
            # Every merge to main publishes a stable release; the patch
            # number is auto-incremented from the highest existing tag in
            # the major.minor line declared by VERSION. The site fetches
            # /releases/latest, so this keeps "newest stable" tracking
            # main without requiring a manual `git tag` step per merge.
            $raw = (Get-Content VERSION -Raw).Trim()
            $parts = $raw.Split('.')
            if ($parts.Count -lt 2 -or $parts.Count -gt 3) {
              throw "VERSION must be 'major.minor' or 'major.minor.patch'. Got: '$raw'"
            }
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $seedPatch = if ($parts.Count -eq 3) { [int]$parts[2] } else { 0 }

            # Next patch in this major.minor — only stable tags count.
            $maxPatch = -1
            foreach ($t in (git tag -l "v${major}.${minor}.*" 2>$null)) {
              if ($t -match "^v(\d+)\.(\d+)\.(\d+)$" -and [int]$Matches[1] -eq $major -and [int]$Matches[2] -eq $minor) {
                $p = [int]$Matches[3]
                if ($p -gt $maxPatch) { $maxPatch = $p }
              }
            }
            $patch       = [Math]::Max($seedPatch, $maxPatch + 1)
            $nextStable  = [version]"$major.$minor.$patch"

            # Stale-VERSION guard. If VERSION lags behind the highest
            # existing stable tag (e.g. operator forgot to bump after a
            # backport bumped the previous minor), the build aborts with
            # instructions instead of publishing a release the SemVer
            # comparer would reject as latest.
            $maxTag = $null
            foreach ($t in (git tag -l "v*" 2>$null)) {
              if ($t -match '^v(\d+\.\d+\.\d+)$') {
                $tv = [version]$Matches[1]
                if ($null -eq $maxTag -or $tv -gt $maxTag) { $maxTag = $tv }
              }
            }
            if ($null -ne $maxTag -and $nextStable -le $maxTag) {
              $suggested = "$($maxTag.Major).$($maxTag.Minor + 1)"
              # NOTE: a PowerShell here-string (@"..."@) cannot be used here.
              # Its body must sit at column 0 to terminate cleanly, but that
              # dedents past the YAML `run: |` block scalar indent and breaks
              # the workflow with "Invalid workflow file ... line N". Build
              # the message as an array + -join instead.
              $msg = @(
                "VERSION file is stale."
                "  Would build stable release for: v$nextStable"
                "  Highest existing stable tag:    v$maxTag"
                ""
                "Bump VERSION to '$suggested' (or higher) and push again."
              ) -join [Environment]::NewLine
              throw $msg
            }

            $v           = "v$nextStable"
            $packVer     = "$nextStable"
            $assemblyVer = "$nextStable.0"
            $prerelease  = 'false'
            # 'legacy' = GitHub server picks Latest by SemVer compare, so
            # this release becomes Latest iff its version beats every other
            # tag. Backports off older branches won't demote a newer main.
            $makeLatest  = 'legacy'
            Write-Host "Stable release (main push): $v"
          }

          # NOTE: the tag is deliberately NOT pushed here. softprops/action-gh-release
          # creates it at release time, so a build failure leaves no orphan tag.
          # For tag-triggered runs the tag already exists and is reused as-is.

          Write-Output "version=$v"                       >> $env:GITHUB_OUTPUT
          Write-Output "pack_version=$packVer"            >> $env:GITHUB_OUTPUT
          Write-Output "assembly_version=$assemblyVer"    >> $env:GITHUB_OUTPUT
          Write-Output "zip=WRAITH-${v}-win-x64.zip"      >> $env:GITHUB_OUTPUT
          Write-Output "prerelease=$prerelease"           >> $env:GITHUB_OUTPUT
          Write-Output "make_latest=$makeLatest"          >> $env:GITHUB_OUTPUT


      - name: Publish WRAITH (self-contained, win-x64)
        shell: pwsh
        run: |
          # Stamp the real version into the binary. Without this the csproj
          # default (1.0.0) is what Velopack's portable-mode fallback reads
          # via Assembly.GetEntryAssembly().GetName().Version, so every
          # release-vs-installed comparison would be wrong for users who
          # downloaded the zip from the website.
          dotnet publish WRAITH/WRAITH.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.ver.outputs.pack_version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }} `
            -p:InformationalVersion=${{ steps.ver.outputs.pack_version }} `
            --output ./publish
          Write-Host "Published files:"
          Get-ChildItem ./publish | Select-Object Name, Length

      # ── Test gates ────────────────────────────────────────────────────────
      # Run BOTH suites before we sign / pack / release. Any failure aborts
      # the job before artefacts hit GitHub Releases.

      - name: Setup Python (for pytest)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest deps
        run: pip install --no-input pytest requests pywin32

      - name: Run pytest (scanner unit tests)
        working-directory: scanner
        run: pytest -v

      - name: Restore + build WRAITH.Tests
        run: |
          dotnet restore WRAITH.Tests/WRAITH.Tests.csproj
          dotnet build WRAITH.Tests/WRAITH.Tests.csproj --configuration Release --no-restore

      - name: Run dotnet test (xUnit services suite)
        run: dotnet test WRAITH.Tests/WRAITH.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Generate .NET SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path:              ./publish
          artifact-name:     sbom-dotnet-${{ steps.ver.outputs.version }}.spdx.json
          output-file:       ./sbom-dotnet.spdx.json
          format:            spdx-json
          upload-artifact:   true

      - name: Generate .NET SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path:              ./publish
          artifact-name:     sbom-dotnet-${{ steps.ver.outputs.version }}.cyclonedx.json
          output-file:       ./sbom-dotnet.cyclonedx.json
          format:            cyclonedx-json
          upload-artifact:   true

      - name: Sign WRAITH.exe
        env:
          SIGNING_CERT_PFX:      ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $exePath = "./publish/WRAITH.exe"

          if ($env:SIGNING_CERT_PFX) {
            # ── Trusted CA cert from repo secrets (production path) ────────────
            Write-Host "Signing with trusted CA certificate from secrets..."

            $pfxPath = Join-Path $env:TEMP "wraith-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_PFX))

            $secPwd = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
            $cert   = Import-PfxCertificate -FilePath $pfxPath `
                        -CertStoreLocation Cert:\CurrentUser\My `
                        -Password $secPwd
            Remove-Item $pfxPath -Force   # never leave the PFX on disk

            $result = Set-AuthenticodeSignature `
                        -FilePath        $exePath `
                        -Certificate     $cert `
                        -TimestampServer "http://timestamp.digicert.com" `
                        -HashAlgorithm   SHA256

            if ($result.Status -notin @("Valid", "UnknownError")) {
              Write-Error "Signing failed: $($result.StatusMessage)"
              exit 1
            }
          } else {
            # ── Self-signed fallback (no secrets configured) ───────────────────
            # Binary is Authenticode-signed so the signature field is present.
            # Windows SmartScreen will show "Unknown Publisher" — users can click
            # through. Upgrade to a trusted cert by adding SIGNING_CERT_PFX secret.
            Write-Host "::warning::SIGNING_CERT_PFX not set — using self-signed certificate. Users will see 'Unknown Publisher' warning."

            $cert = New-SelfSignedCertificate `
                      -Subject         "CN=WRAITH Open Source, O=OpenSource-For-Freedom" `
                      -Type            CodeSigning `
                      -CertStoreLocation Cert:\CurrentUser\My `
                      -KeySpec         Signature `
                      -HashAlgorithm   SHA256 `
                      -KeyLength       4096 `
                      -NotAfter        (Get-Date).AddYears(1)

            $result = Set-AuthenticodeSignature `
                        -FilePath    $exePath `
                        -Certificate $cert `
                        -HashAlgorithm SHA256

            if ($result.Status -notin @("Valid", "UnknownError")) {
              Write-Error "Self-signing failed: $($result.StatusMessage)"
              exit 1
            }
          }

          # Verify embedded signature is readable regardless of cert type
          $sig = Get-AuthenticodeSignature $exePath
          Write-Host "Signed OK  status=$($sig.Status)  signer='$($sig.SignerCertificate.Subject)'"

      - name: Stage release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./release -Force | Out-Null

          # ZIP ships the runtime payload the app needs to function: the
          # signed Windows EXE plus the scanner/ and automation/ directories
          # that BootstrapService + AutomationMenuService look for next to
          # the EXE. The Content includes in WRAITH.csproj copy them into
          # ./publish — `CopyToOutputDirectory` puts them ALONGSIDE the
          # single-file binary, NOT inside it; the single-file bundler only
          # ingests managed assemblies and native libs, so without this
          # copy step every Python-backed scan fails with
          # "Python scanner not found at <extract-dir>\scanner\scanner.py".
          #
          # Excluded from the archive: START.bat, quick-scan.ps1,
          # wraith.env.json, LICENSE, the repo's CI/test files. The user
          # double-clicks WRAITH.exe and the bootstrap handles the rest.
          Copy-Item ./publish/WRAITH.exe ./release/WRAITH.exe
          Copy-Item ./README.md          ./release/README.md

          # Pull from ./publish so the same Exclude pattern that keeps
          # test_*.py and __pycache__ out of csproj output keeps them out
          # of the ZIP too — no duplicate filter to drift.
          if (Test-Path ./publish/scanner)    { Copy-Item -Recurse ./publish/scanner    ./release/scanner }
          if (Test-Path ./publish/automation) { Copy-Item -Recurse ./publish/automation ./release/automation }

      - name: Generate Python scanner SBOM
        uses: anchore/sbom-action@v0
        with:
          path:              ./scanner
          artifact-name:     sbom-scanner-${{ steps.ver.outputs.version }}.spdx.json
          output-file:       ./sbom-scanner.spdx.json
          format:            spdx-json
          upload-artifact:   true

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Velopack requires a NORMAL (non-single-file) publish to work correctly.
      # Single-file merges all assemblies into one blob that Velopack cannot
      # introspect, sign delta patches against, or bootstrap its update hooks into.
      # We keep the single-file publish above for the portable ZIP distribution,
      # and produce a separate multi-file output purely for the Velopack installer.
      - name: Publish WRAITH for Velopack (multi-file, win-x64)
        shell: pwsh
        run: |
          dotnet publish WRAITH/WRAITH.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.ver.outputs.pack_version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.ver.outputs.assembly_version }} `
            -p:InformationalVersion=${{ steps.ver.outputs.pack_version }} `
            --output ./publish-velopack
          Write-Host "Velopack publish files:"
          Get-ChildItem ./publish-velopack | Select-Object Name, Length

      - name: Package with Velopack
        shell: pwsh
        run: |
          # pack_version is the bare SemVer (no 'v'), with -dev.N suffix on
          # prereleases. Velopack accepts SemVer2 with prerelease suffixes.
          $v = "${{ steps.ver.outputs.pack_version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            throw "--packVersion must be SemVer2. Got: '$v'"
          }

          # Pull the [Unreleased] section out of CHANGELOG.md and write it next to
          # the publish dir so vpk embeds it in the nupkg. The in-app update dialog
          # surfaces this text via TargetFullRelease.NotesMarkdown — without it the
          # user just sees "No release notes were provided for this version."
          $notes = ""
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = ($lines | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
            if ($start) {
              $tail  = $lines[$start..($lines.Length - 1)]
              $stop  = ($tail | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
              $notes = if ($stop) { $tail[0..($stop - 2)] -join "`n" } else { $tail -join "`n" }
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Release $v — see https://github.com/OpenSource-For-Freedom/wraith/releases/tag/v$v"
          }
          $notesPath = "./release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding UTF8

          vpk pack `
            --packId WRAITH `
            --packVersion $v `
            --packDir ./publish-velopack `
            --mainExe WRAITH.exe `
            --releaseNotes $notesPath `
            --outputDir ./velopack-out
          Write-Host "Velopack output:"
          Get-ChildItem ./velopack-out | Select-Object Name, Length

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "${{ steps.ver.outputs.zip }}"
          Compress-Archive -Path ./release/* -DestinationPath $zip -CompressionLevel Optimal
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Created ${zip}  (${size} MB)"

      # ── Portable-ZIP smoke test ───────────────────────────────────────────
      # Catches the regression that broke v1.0.65-dev.87: the staging step
      # produced a ZIP that omitted scanner/ + automation/, so end users
      # extracted and ran WRAITH.exe → every Python-backed scan failed with
      # "Python scanner not found at <extract-dir>\scanner\scanner.py" because
      # BootstrapService.ResolveBaseDir() joins "scanner" to the EXE dir.
      #
      # Unpack the ACTUAL produced ZIP (not ./release) so the test also
      # catches Compress-Archive weirdness, then assert each runtime
      # dependency exists. Also assert the "junk" exclusions PR #36 made
      # are still excluded — regressions in the other direction matter too.
      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          $zip = "${{ steps.ver.outputs.zip }}"
          $unpack = Join-Path $env:RUNNER_TEMP "zip-verify"
          if (Test-Path $unpack) { Remove-Item -Recurse -Force $unpack }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force

          $required = @(
            "WRAITH.exe",
            "README.md",
            "scanner/scanner.py",                                # Bootstrap entry
            "automation/Register-WraithTimedScan.ps1",           # Tray: auto scan
            "automation/Register-WraithPersistenceListener.ps1"  # Tray: persistence
          )
          $forbidden = @(
            "START.bat",            # PR #36 removed — must not come back
            "quick-scan.ps1",       # PR #36 removed
            "wraith.env.json",      # bootstrap creates fresh per install
            "LICENSE",              # repo metadata, not runtime
            "scanner/test_heuristics.py",
            "scanner/__pycache__"
          )

          $missing = @()
          foreach ($f in $required) {
            $p = Join-Path $unpack $f
            if (-not (Test-Path $p)) { $missing += $f }
          }
          $leaked = @()
          foreach ($f in $forbidden) {
            $p = Join-Path $unpack $f
            if (Test-Path $p) { $leaked += $f }
          }

          Write-Host "ZIP contents (top level):"
          Get-ChildItem $unpack | Select-Object Mode, Length, Name | Format-Table | Out-String | Write-Host

          if ($missing.Count -gt 0 -or $leaked.Count -gt 0) {
            if ($missing.Count -gt 0) {
              Write-Host "::error::Portable ZIP is missing required files:"
              $missing | ForEach-Object { Write-Host "::error::  - $_" }
            }
            if ($leaked.Count -gt 0) {
              Write-Host "::error::Portable ZIP contains files that should be excluded:"
              $leaked | ForEach-Object { Write-Host "::error::  - $_" }
            }
            throw "Portable ZIP smoke test failed — refusing to publish a broken release."
          }
          Write-Host "Portable ZIP smoke test passed."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:              ${{ steps.ver.outputs.version }}
          name:                  WRAITH ${{ steps.ver.outputs.version }}
          draft:                 false
          prerelease:            ${{ steps.ver.outputs.prerelease }}
          # 'legacy' = GitHub server decides latest by SemVer compare, so a
          # backport tag (e.g. v1.0.6 while v2.x is current) won't demote v2.x.
          # Prereleases force 'false' so dev builds never become latest.
          make_latest:           ${{ steps.ver.outputs.make_latest }}
          files: |
            ${{ steps.ver.outputs.zip }}
            sbom-dotnet.spdx.json
            sbom-dotnet.cyclonedx.json
            sbom-scanner.spdx.json
          generate_release_notes: true
          body: |
            <p align="center"><img src="WRAITH/Assets/wraith.png" alt="WRAITH" width="480"/></p>

            ## WRAITH — Expecto Patronum · Windows Threat Hunter

            ### Install
            1. Download **`${{ steps.ver.outputs.zip }}`** below
            2. Extract anywhere (e.g. `C:\Tools\WRAITH\`)
            3. Double-click **`WRAITH.exe`**

            > **Requires Administrator** — UAC prompt will appear on first launch.

            ### Requirements
            | | |
            |---|---|
            | OS | Windows 10 / 11 x64 |
            | .NET runtime | **Not needed** — bundled inside WRAITH.exe |

      - name: Upload Velopack assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.ver.outputs.version }} ./velopack-out/* --clobber

  # ── Discord notification ──────────────────────────────────────────────────
  # Runs after build-and-release with `if: always()` so it fires on BOTH
  # success and failure. Pulls the last few first-parent commits from this
  # push so the channel sees what landed (or what tried to). DISCORD_ALERT
  # is the webhook URL secret — the job no-ops if it isn't set.
  notify-discord:
    name: Notify Discord
    needs: build-and-release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Post status to Discord
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT }}
          STATUS:  ${{ needs.build-and-release.result }}
          REPO:    ${{ github.repository }}
          REF:     ${{ github.ref_name }}
          ACTOR:   ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_ALERT secret not set — skipping notification."
            exit 0
          fi

          # Compact commit list — last 5 first-parent commits, one per line.
          # Discord embed field caps at 1024 chars; trim defensively.
          commits=$(git log -5 --first-parent --pretty=format:'• `%h` %s' | head -c 900)

          python3 - "$STATUS" "$REPO" "$REF" "$ACTOR" "$RUN_URL" "$commits" <<'PY' > payload.json
          import json, sys
          status, repo, ref, actor, run_url, commits = sys.argv[1:]
          ok = status == "success"
          payload = {
              "username": "WRAITH CI",
              "embeds": [{
                  "title":  ("✅ WRAITH build succeeded" if ok
                             else f"❌ WRAITH build FAILED ({status})"),
                  "url":    run_url,
                  "color":  3066993 if ok else 15158332,
                  "fields": [
                      {"name": "Repo / Ref", "value": f"`{repo}` @ `{ref}`", "inline": True},
                      {"name": "Pushed by",  "value": f"@{actor}",          "inline": True},
                      {"name": "Recent commits", "value": commits or "_(none)_", "inline": False},
                  ],
                  "footer": {"text": "GitHub Actions · build-and-release"},
              }],
          }
          print(json.dumps(payload))
          PY

          # Best-effort POST. Two failure modes covered:
          #  - DNS/network errors → curl exits non-zero on its own.
          #  - HTTP error responses (429 rate-limit, 5xx) → without --fail,
          #    curl -sS exits 0 on any HTTP status. --fail makes it exit
          #    22 on >=400 so the warning branch actually runs.
          # Either way, the release itself isn't affected; the catch-all
          # `|| echo ::warning` keeps `set -euo pipefail` happy.
          curl --fail -sS -X POST -H 'Content-Type: application/json' \
               --data @payload.json "${WEBHOOK}" \
            || echo "::warning::Discord notification POST failed (transient network, rate limit, or 5xx); release itself was not affected."

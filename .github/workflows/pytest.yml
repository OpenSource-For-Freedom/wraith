name: pytest

on:
  pull_request:
    paths:
      - 'scanner/**'
      - '.github/workflows/pytest.yml'
# Main-push coverage is handled inline by deploy.yml — running the same
# suite here too would be redundant and would race with the deploy job.

permissions:
  contents: read

jobs:
  pytest:
    # Job name matches the workflow filename so the branch protection
    # rule configured against "pytest.yml" actually resolves to this
    # check. GitHub Actions reports checks by job `name:` (or, if
    # omitted, the job key), not by workflow file path.
    name: pytest.yml
    # WRAITH is a Windows app — the scanners call PowerShell, winreg, and
    # pywin32. Running tests on a Windows runner means the platform-conditional
    # skips activate as REAL tests instead of being silently skipped on Ubuntu.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test deps
        # 'requests' is a runtime dep of ioc_enricher / cisa_kev_scanner.
        # pywin32 is needed on Windows runners so the Windows-only scanners
        # can be imported and exercised.
        run: pip install --no-input pytest requests pywin32
      - name: Run tests
        working-directory: scanner
        run: pytest -v

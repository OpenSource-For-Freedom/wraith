name: pytest

on:
  pull_request:
    paths:
      - 'scanner/**'
      - '.github/workflows/pytest.yml'
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - '.github/workflows/pytest.yml'

permissions:
  contents: read

jobs:
  pytest:
    name: scanner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install --no-input pytest
      - name: Run tests
        # The scanner package itself doesn't need its full Windows-only
        # requirements (pywin32, yara-python) — the test suites for the
        # threat-intel feeds are pure-Python and mock subprocess calls.
        working-directory: scanner
        run: pytest test_feed_store.py test_vuln_driver_scanner.py test_tor_check.py test_digitalside_intel.py -v
